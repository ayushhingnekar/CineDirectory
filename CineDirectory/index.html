<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineDirectory - Discover your Next Favourite Movie</title>
    <link rel="icon" type="png" href="./posters/CineDirectory-Logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
</head>

<body>
    <!-- Navbar Section -->
    <nav class="fixed-top">
        <div class="nav-container">
            <div class="logo">
                <h1 class="fw-bold"> <i class="fa-solid fa-clapperboard"></i>CineDirectory</h1>
            </div>

            <div id="nav-items" class="d-flex align-items-center">
                <a class="text-light" href="#"> Home </a>
                <a class="text-light" href="#"> Movies </a>
                <a class="text-light" href="#"> My List </a>
                
                <div class="nav-search">
                    <span><i class="fa-solid fa-magnifying-glass search-icon"></i></span>
                    <input type="text" id="search-container" placeholder="Search movies here"><button id="search-button">Search</button>
                </div>
            </div>
        </div>
    </nav>


    <!-- Main Section -->
    <main>
        <div class="slider-banner">
            <div class="banner">
                <img src="./posters/Dhurandhar.jpg">
                <img src="./posters/Taskaree.png">
                <img src="./posters/Stranger-Things.jpg">
                <img src="./posters/Captain-America-brave-new-world.webp">
                <img src="./posters/Border-2.jpg">
            </div>
            <button class="prev">❮</button>
            <button class="next">❯</button>
        </div>

        <div class="main-content">
            <div class="trending-container">
                <h3>Trending Now</h3>
                <div id="trending-banner" class="row d-flex justify-content-center">
                    <img class="col-lg-2" src="./posters/Dhurandhar-mini.avif">
                    <img class="col-lg-2" src="./posters/Taskaree-mini.png">
                    <img class="col-lg-2" src="./posters/The-great-indian-kapil-show-mini.jpg">
                    <img class="col-lg-2" src="./posters/Tere_Ishq-Mein-mini.jpg">
                    <img class="col-lg-2" src="./posters/Stranger-Things-mini.jpg">
                    <img class="col-lg-2" src="./posters/Haq-Mini.jpg">
                </div>
            </div>

            <div class="top-rated-container">
                <h3>Top-rated movies on IMDB</h3>
                <div id="top-rated-banner" class="row d-flex justify-content-center">
                    <img class="col-lg-2" src="./posters/Flow-Mini.webp">
                    <img class="col-lg-2" src="./posters/Spiderman-NoWayHome-Mini.jpg">
                    <img class="col-lg-2" src="./posters/Interstellar-Mini.jpg">
                    <img class="col-lg-2" src="./posters/Inception-Mini.jpg">
                    <img class="col-lg-2" src="./posters/Apocalypto-Mini.jpg">
                    <img class="col-lg-2" src="./posters/TopGunMaverick-Mini.jpg">
                </div>
            </div>

            <div class="action-container">
                <h3>Action and adventure movies</h3>
                <div id="action-banner" class="row justify-content-center">
                    <img class="col-lg-2" src="./posters/KGF-Mini.jpg">
                    <img class="col-lg-2" src="./posters/Coolie-Mini.jpg">
                    <img class="col-lg-2" src="./posters/Baaghi4-Mini.jpg">
                    <img class="col-lg-2" src="./posters/Mission_Impossible-Mini.jpg">
                    <img class="col-lg-2" src="./posters/Kantara-Mini.jpeg">
                    <img class="col-lg-2" src="./posters/kalki2-Mini.jpeg">
                </div>
            </div>

            <div class="romance-container">
                <h3>Romance Movies</h3>
                <div id="romance-banner" class="row justify-content-center">
                    <img class="col-lg-2" src="./posters/SitaRamam-Mini.jpg">
                    <img class="col-lg-2" src="./posters/JabWeMet-Mini.jpg">
                    <img class="col-lg-2" src="./posters/RockyAurRani-Mini.jpg">
                    <img class="col-lg-2" src="./posters/AjabPremKiGajabKahani-Mini.webp">
                    <img class="col-lg-2" src="./posters/YourFault-Mini.webp">
                    <img class="col-lg-2" src="./posters/MyFault-Mini.webp">
                </div>
            </div>

            <div class="horror-container">
                <h3>Horror Movies</h3>
                <div id="horror-banner" class="row justify-content-center">
                    <img class="col-lg-2" src="./posters/TheConjuring-Mini.jpg">
                    <img class="col-lg-2" src="./posters/TheMeg-Mini.jpg">
                    <img class="col-lg-2" src="./posters/AnnabelleCreation-Mini.jpg">
                    <img class="col-lg-2" src="./posters/Lupt-Mini.jpg">
                    <img class="col-lg-2" src="./posters/KrishnaCottage_Mini.jpeg">
                    <img class="col-lg-2" src="./posters/AnnabelleComesHomes-Mini.jpg">
                </div>
            </div>
        </div>
    </main>



    <script src="project.js"> </script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
</body>
</html>
